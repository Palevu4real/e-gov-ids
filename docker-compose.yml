services:
  postgres:
    image: postgres:16-alpine
    container_name: ids_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ids_net]

  redis:
    image: redis:7-alpine
    container_name: ids_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ids_net]

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    container_name: ids_redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [ids_net]

  kafka-init:
    image: redpandadata/redpanda:v24.1.7
    container_name: ids_kafka_init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "rpk topic create ids.detections -p 1 -r 1 || true;
       rpk topic create ids.dlq -p 1 -r 1 || true;
       echo 'Topics ready.'"
    networks: [ids_net]

  backend:
    build: ./backend
    container_name: ids_backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks: [ids_net]

  detection-engine:
    build: ./detection-engine
    container_name: ids_detection
    env_file: .env
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./detection-engine:/app
      - ./detection-engine/pcaps:/pcaps
    command: ["python", "-m", "engine.main"]
    networks: [ids_net]

  frontend:
    build: ./frontend
    container_name: ids_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    command: ["npm", "run", "dev", "--", "--host"]
    networks: [ids_net]

volumes:
  postgres_data:
  redis_data:
  redpanda_data:

networks:
  ids_net:
    driver: bridge